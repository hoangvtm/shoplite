name: CI

# Chạy khi có PR vào nhánh main
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Hủy lần chạy cũ của cùng PR khi có commit mới
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  # Quét bí mật trong toàn bộ lịch sử git; cảnh báo giả khai báo ở .gitleaksignore
  gitleaks:
    name: Quét bí mật (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (đủ lịch sử)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "${base}/${tarball}"
          curl -fsSL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Quét
        run: gitleaks git --redact --verbose .

  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      # lint + typecheck + test
      - name: Kiểm tra
        run: npm run check

      - name: Kiểm tra format
        run: npm run format:check
